<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>
    <link rel="stylesheet" href="/css/style.css?v=lavender-sage-app-1">
</head>
<body class="auth-page">
    <main class="container auth-container">
        <div th:replace="~{fragments/layout :: authBrand}"></div>
        <h1 class="page-title">ログイン</h1>
        <p class="error" role="alert" th:if="${param.error != null}">ユーザー名またはパスワードが違います。</p>
        <p class="flash" role="status" th:if="${param.logout != null}">ログアウトしました。</p>
        <p class="flash" role="status" th:if="${param.setup != null}">設定しました。決めたユーザー名とパスワードでログインしてください。</p>
        <form th:action="@{/login}" method="post">
            <div class="form-row">
                <label class="form-label" for="username">ユーザー名</label>
                <input class="form-input" id="username" name="username" autocomplete="username" maxlength="50" required autofocus>
            </div>
            <div class="form-row">
                <label class="form-label" for="password">パスワード</label>
                <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit">ログイン</button>
        </form>
    </main>
</body>
</html>
