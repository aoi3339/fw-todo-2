<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css?v=pagination-1">
</head>
<body>
    <div class="container">
        <h1 class="page-title">やること一覧</h1>

        <p class="flash" th:if="${message != null}" th:text="${message}"></p>

        <form class="search-bar" th:action="@{/todos}" method="get">
            <div>
                <label class="form-label" for="keyword">やることの名前</label>
                <input class="form-input" type="text" id="keyword" name="keyword" th:value="${keyword}">
            </div>
            <div>
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" id="category" name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </div>
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="page" value="1">
            <label>
                <input type="checkbox" name="showCompleted" value="true" th:checked="${showCompleted}">
                完了したものも表示する
            </label>
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc', showCompleted=${showCompleted}, page=1)}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc', showCompleted=${showCompleted}, page=1)}">期限が遠い順</a>
        </form>

        <a class="btn" th:href="@{/todos/new}">新規登録</a>

        <a class="btn sub" th:href="@{/calendar}">カレンダーで見る</a>

        <p th:if="${#lists.isEmpty(todos)}">条件に一致するやることはありません</p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:attr="data-due-date=${todo.dueDate}, data-completed=${todo.completed}">
                    <td th:text="${todo.title}">やること</td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td>
                        <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</span>
                        <span class="priority-mark" th:if="${todo.priority == 1}" aria-hidden="true">★</span>
                    </td>
                    <td th:text="${todo.dueDate}">期限</td>
                    <td th:text="${todo.completed ? '完了' : '未完了'}">状態</td>
                    <td>
                        <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                        <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <nav class="pagination" aria-label="一覧のページ" th:unless="${#lists.isEmpty(todos)}">
            <th:block th:each="pageNumber : ${#numbers.sequence(1, totalPages)}">
                <span class="page-number is-current" aria-current="page"
                    th:if="${pageNumber == currentPage}" th:text="${pageNumber}">1</span>
                <a class="page-number" th:unless="${pageNumber == currentPage}"
                    th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, showCompleted=${showCompleted}, page=${pageNumber})}"
                    th:text="${pageNumber}">2</a>
            </th:block>
        </nav>
    </div>
    <script>
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

        for (const row of document.querySelectorAll(".todo-table tbody tr")) {
            const dueDate = row.dataset.dueDate;
            const completed = row.dataset.completed === "true";
            if (dueDate && dueDate < today && !completed) {
                row.classList.add("is-overdue");
            }
        }
    </script>
</body>
</html>
