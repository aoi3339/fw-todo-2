<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css?v=weather-icons-1">
</head>
<body>
    <div class="container">
        <p id="holiday-unavailable" class="flash" hidden>祝日を取れませんでした</p>
        <h1 class="page-title" th:text="${year + '年' + month + '月'}">2026年4月</h1>

        <div class="calendar-toolbar">
            <nav class="calendar-navigation" aria-label="月の移動">
                <a class="btn sub" th:href="@{/calendar(year=${previousYear}, month=${previousMonth})}">前の月</a>
                <a class="btn sub" th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}">次の月</a>
            </nav>
            <nav class="calendar-actions" aria-label="画面の移動">
                <a class="btn sub" th:href="@{/todos}">表で見る</a>
                <a class="btn" th:href="@{/todos/new}">新規登録</a>
            </nav>
        </div>

        <table class="calendar-table" th:attr="data-from=${dataFrom}, data-to=${dataTo}">
            <thead>
                <tr>
                    <th th:each="weekday : ${weekdays}" th:text="${weekday}">日</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <td class="calendar-day is-empty" th:if="${day == null}" th:each="day : ${week}"></td>
                    <td class="calendar-day" th:unless="${day == null}" th:each="day : ${week}"
                        th:attr="data-date=${day}">
                        <span th:text="${day.getDayOfMonth()}">1</span>
                        <div class="calendar-weather" aria-label="天気"></div>
                    </td>
                </tr>
            </tbody>
        </table>
        <p class="weather-source">天気：東京（新宿付近）・神奈川（横浜付近）。予報のある日のみ表示。<br>
            提供：<a href="https://open-meteo.com/">Open-Meteo</a>
            （<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>）
        </p>
    </div>
    <script>
        const calendar = document.querySelector(".calendar-table");
        const from = calendar.dataset.from;
        const to = calendar.dataset.to;

        async function loadTodos() {
            const res = await fetch(`/api/todos?from=${from}&to=${to}`);
            const todos = await res.json();
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

            const dateCells = document.querySelectorAll(".calendar-day[data-date]");
            for (const cell of dateCells) {
                const date = cell.dataset.date;
                const matchingTodos = todos.filter(todo => todo.dueDate === date);
                for (const todo of matchingTodos.slice(0, 3)) {
                    const title = document.createElement("a");
                    title.className = "calendar-todo";
                    title.href = `/todos/${todo.id}/edit`;
                    title.textContent = todo.title;
                    if (todo.dueDate < today && !todo.completed) {
                        title.style.color = "#dc2626";
                    }
                    cell.appendChild(title);
                }
                const hiddenCount = matchingTodos.length - 3;
                if (hiddenCount > 0) {
                    const more = document.createElement("div");
                    more.textContent = `ほか ${hiddenCount}件`;
                    cell.appendChild(more);
                }
            }
        }

        async function loadHolidays() {
            const res = await fetch(`/api/holidays?from=${from}&to=${to}`);
            const holidays = await res.json();

            if (res.headers.has("X-Holidays-Unavailable")) {
                document.querySelector("#holiday-unavailable").hidden = false;
            }

            const dateCells = document.querySelectorAll(".calendar-day[data-date]");
            for (const cell of dateCells) {
                const date = cell.dataset.date;
                const dayOfWeek = new Date(`${date}T00:00:00`).getDay();

                if (Object.prototype.hasOwnProperty.call(holidays, date)) {
                    cell.title = holidays[date];
                    cell.style.backgroundColor = "#fef3c7";
                } else if (dayOfWeek === 0) {
                    cell.style.backgroundColor = "#fce7f3";
                } else if (dayOfWeek === 6) {
                    cell.style.backgroundColor = "#dbeafe";
                }
            }
        }

        const weatherSymbols = {
            "晴れ": "☀️",
            "晴れ時々くもり": "🌤️",
            "くもり": "☁️",
            "霧": "🌫️",
            "霧雨": "🌧️",
            "凍る雨": "🧊🌧️",
            "雨": "🌧️",
            "雪": "🌨️",
            "雷雨": "⛈️"
        };

        async function loadWeather() {
            try {
                const res = await fetch(`/api/weather?from=${from}&to=${to}`);
                if (!res.ok) return;
                const weather = await res.json();
                const dateCells = document.querySelectorAll(".calendar-day[data-date]");
                for (const cell of dateCells) {
                    const regions = weather[cell.dataset.date];
                    if (!regions) continue;
                    const container = cell.querySelector(".calendar-weather");
                    for (const region of ["東京", "神奈川"]) {
                        const description = regions[region];
                        const symbol = weatherSymbols[description];
                        if (!symbol) continue;
                        const line = document.createElement("div");
                        line.textContent = `${region}：`;
                        const icon = document.createElement("span");
                        icon.className = "weather-icon";
                        icon.textContent = symbol;
                        icon.title = description;
                        icon.setAttribute("role", "img");
                        icon.setAttribute("aria-label", description);
                        line.appendChild(icon);
                        container.appendChild(line);
                    }
                }
            } catch (error) {
                // 天気の取得に失敗しても、日付・やること・祝日の表示は続ける。
            }
        }

        loadTodos();
        loadHolidays();
        loadWeather();
    </script>
</body>
</html>
